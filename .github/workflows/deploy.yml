name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit,
  # which is what you want when a deploy failed for an infrastructure reason
  # rather than a code one.
  workflow_dispatch:

concurrency:
  # One deploy at a time. Not cancel-in-progress: cancelling half way through
  # `wrangler deploy` would leave the upload in an unknown state, and the run
  # that cancelled it is not necessarily the newer code.
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time only, and deliberately not a real secret.
      #
      # `next build` runs with NODE_ENV=production and prerenders /sitemap.xml,
      # which calls getServerEnv() - and that refuses to start in production
      # without a 32+ character APP_SECRET. The value is never used to sign
      # anything here: the key that signs embed tokens at runtime is a Worker
      # secret (`wrangler secret put APP_SECRET`) and must never be in this file
      # or in GitHub. The app reads process.env as a whole object rather than a
      # static process.env.APP_SECRET reference, so no bundler can inline this
      # into the build output.
      APP_SECRET: ci-build-placeholder-not-used-to-sign-anything-000000

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Reads the pnpm version from "packageManager" in package.json, so this
        # stays correct when that is bumped.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile makes a lockfile that disagrees with package.json a
        # build failure rather than something CI silently resolves differently
        # from every developer machine.
        run: pnpm install --frozen-lockfile

      - name: Build and type check
        # `next build` type checks as part of building, with the typedRoutes
        # types generated, which a bare `tsc --noEmit` on a fresh checkout does
        # not have. This is the gate that catches a bad route literal or a type
        # error before anything reaches Cloudflare.
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Build the Workers bundle
        run: pnpm run build:vinext

      - name: Deploy
        run: pnpm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the deployment
        # A successful upload is not a working app. /api/health also pings
        # Postgres through Hyperdrive, so this fails the run if the binding or
        # the database is wrong - the difference between "deployed" and "up".
        # Retried because a new version takes a moment to propagate.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 30 https://dot.rajahx.com/api/health) && {
              echo "$body"
              case "$body" in
                *'"database":"ok"'*) echo "Health check passed."; exit 0 ;;
                *) echo "Reachable, but the database check did not report ok." ;;
              esac
            }
            echo "Attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          echo "Deployment did not become healthy."
          exit 1
