name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Pull requests run `verify` only. The gate is worth having before the merge,
  # not just after it, and `deploy` is skipped below so a PR can never publish.
  pull_request:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit,
  # which is what you want when a deploy failed for an infrastructure reason
  # rather than a code one.
  workflow_dispatch:

concurrency:
  # Keyed on the ref so a pull request cannot queue behind (or hold up) a deploy
  # of main. Superseded PR runs are cancelled; a deploy of main never is -
  # cancelling half way through `wrangler deploy` would leave the upload in an
  # unknown state, and the run that cancelled it is not necessarily newer code.
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build-time only, and deliberately not a real secret.
  #
  # `next build` runs with NODE_ENV=production and prerenders /sitemap.xml,
  # which calls getServerEnv() - and that refuses to start in production
  # without a 32+ character APP_SECRET. The value is never used to sign
  # anything here: the key that signs embed tokens at runtime is a Worker
  # secret (`wrangler secret put APP_SECRET`) and must never be in this file
  # or in GitHub. The app reads process.env as a whole object rather than a
  # static process.env.APP_SECRET reference, so no bundler can inline this
  # into the build output.
  APP_SECRET: ci-build-placeholder-not-used-to-sign-anything-000000

  # Firebase CLIENT configuration, inlined into the browser bundle by
  # `next build` and `vinext build`. It has to be here rather than in
  # wrangler.jsonc: by the time the Worker runs, the bundle is already written,
  # so a Worker var cannot supply it. The server half is FIREBASE_PROJECT_ID,
  # which IS a Worker var because it is read at request time.
  #
  # Repository variables, not secrets. A Firebase web API key is an identifier,
  # not a credential - Google publishes it in every documented web snippet - and
  # what protects the project is its Console configuration (authorized domains,
  # enabled providers, quotas). The service-account private key is the thing
  # that must never be here, and it is not: token verification uses Google's
  # published public keys, so nothing on the request path wants one.
  #
  # Unset until the Firebase project exists, which is exactly right: they
  # inline as empty, `getFirebaseClientConfig()` returns null, and the
  # application falls back to its own password credentials (ADR 0001).
  # See docs/firebase-auth.md.
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Reads the pnpm version from "packageManager" in package.json, so this
        # stays correct when that is bumped.
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile makes a lockfile that disagrees with package.json a
        # build failure rather than something CI silently resolves differently
        # from every developer machine.
        run: pnpm install --frozen-lockfile

      - name: Build and type check
        # `next build` type checks as part of building, with the typedRoutes
        # types generated, which a bare `tsc --noEmit` on a fresh checkout does
        # not have. Note that CI has no tsconfig.tsbuildinfo, so this is a full
        # check - it will catch errors that an incremental local run skips.
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Build the Workers bundle
        # Built here too so a pull request fails on a Workers-specific build
        # problem - a middleware matcher vinext cannot compile, say - rather
        # than discovering it during the deploy that follows the merge.
        run: pnpm run build:vinext

  deploy:
    needs: verify
    # Never on a pull request, even one from a branch in this repository.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Workers bundle
        # Rebuilt rather than carried over from `verify` as an artifact: the
        # bundle is a few seconds of work and passing it between jobs would add
        # a way for what was tested and what ships to drift apart.
        run: pnpm run build:vinext

      - name: Deploy
        run: pnpm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the deployment
        # A successful upload is not a working app. /api/health pings Postgres
        # through Hyperdrive AND checks that the schema is actually there, so
        # this fails the run if the binding, the database or the migrations are
        # wrong - the difference between "deployed" and "up".
        #
        # Both conditions are asserted, and the schema one is not optional: the
        # endpoint used to check connectivity alone, this step went green over a
        # Supabase project whose migrations had never been run, and the first
        # real visitor got "Something went wrong" on sign-in. `curl -f` already
        # fails on the 503 that /api/health now returns in that state; the
        # explicit case below is what says WHY in the log.
        #
        # Retried because a new version takes a moment to propagate.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 30 https://dot.rajahx.com/api/health); then
              echo "$body"
              case "$body" in
                *'"database":"ok"'*'"schema":"ok"'*)
                  echo "Health check passed."; exit 0 ;;
                *'"schema":"missing"'*)
                  echo "Reachable, but the schema is missing - run the database migrations against the deployed database." ;;
                *)
                  echo "Reachable, but the database check did not report ok." ;;
              esac
            fi
            echo "Attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          echo "Deployment did not become healthy."
          exit 1
